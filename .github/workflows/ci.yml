name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  admin:
    name: Admin (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn run lint
      - run: yarn run build
      # The Go packages embed the built SPA, so share it with the Go jobs.
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist

  go:
    name: Go (build + test + lint)
    needs: admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: pkg/adminui/admin
      - run: go build ./cmd/hettix
      - run: go test ./pkg/...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  desktop:
    name: Desktop (Windows build)
    needs: admin
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: pkg/adminui/admin
      - run: go build ./cmd/hettix-desktop
      - run: go vet ./cmd/hettix-desktop
