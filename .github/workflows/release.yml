name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v); build-only, does not publish"
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and embed admin UI
        run: |
          cd admin && yarn install --frozen-lockfile && yarn run build && cd ..
          rm -rf pkg/adminui/admin && cp -R admin/dist pkg/adminui/admin
      - name: Cross-compile hettix
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          build() {
            os=$1; arch=$2; ext=$3
            GOOS=$os GOARCH=$arch go build -ldflags "-s -w -X main.version=${VERSION}" -o "hettix${ext}" ./cmd/hettix
            # "cli" in the name so the headless server isn't mistaken for the desktop app.
            name="hettix-cli_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then zip -q "dist/${name}.zip" "hettix${ext}"; else tar -czf "dist/${name}.tar.gz" "hettix${ext}"; fi
            rm -f "hettix${ext}"
          }
          build linux amd64 ""
          build linux arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""
          build windows amd64 ".exe"
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*

  installer:
    name: Desktop (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -Version ${{ steps.v.outputs.version }}
      - name: Collect assets
        shell: bash
        run: |
          mkdir -p out
          cp cmd/hettix-desktop/build/bin/Hettix.exe out/Hettix.exe
          cp installer/out/hettix-setup-*.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: out/*

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build and embed admin UI
        run: |
          cd admin && yarn install --frozen-lockfile && yarn run build && cd ..
          rm -rf pkg/adminui/admin && cp -R admin/dist pkg/adminui/admin
      - name: Build app bundle
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd cmd/hettix-desktop
          "$(go env GOPATH)/bin/wails" build -s -skipbindings -platform darwin/universal -ldflags "-X main.version=${VERSION}"
      - name: Bundle Chromium into the app
        run: |
          APP=cmd/hettix-desktop/build/bin/Hettix.app/Contents/MacOS
          REV=$(curl -fsSL https://storage.googleapis.com/chromium-browser-snapshots/Mac_Arm/LAST_CHANGE)
          curl -fsSL "https://storage.googleapis.com/chromium-browser-snapshots/Mac_Arm/${REV}/chrome-mac.zip" -o chrome-mac.zip
          mkdir -p "$APP/browser"
          unzip -q chrome-mac.zip -d "$APP/browser"
          chmod -R +x "$APP/browser/chrome-mac/Chromium.app/Contents/MacOS" || true
      - name: Package .app
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          ditto -c -k --keepParent cmd/hettix-desktop/build/bin/Hettix.app "out/Hettix_${VERSION}_macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: out/*

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - name: Install WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build and embed admin UI
        run: |
          cd admin && yarn install --frozen-lockfile && yarn run build && cd ..
          rm -rf pkg/adminui/admin && cp -R admin/dist pkg/adminui/admin
      - name: Build app binary
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd cmd/hettix-desktop
          "$(go env GOPATH)/bin/wails" build -s -skipbindings -tags webkit2_41 -ldflags "-X main.version=${VERSION}" -o Hettix
      - name: Bundle Chromium next to the binary
        run: |
          REV=$(curl -fsSL https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/LAST_CHANGE)
          curl -fsSL "https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/${REV}/chrome-linux.zip" -o chrome-linux.zip
          mkdir -p cmd/hettix-desktop/build/bin/browser
          unzip -q chrome-linux.zip -d cmd/hettix-desktop/build/bin/browser
          chmod +x cmd/hettix-desktop/build/bin/browser/chrome-linux/chrome || true
      - name: Package binary
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          tar -C cmd/hettix-desktop/build/bin -czf "out/Hettix_${VERSION}_linux_amd64.tar.gz" Hettix browser
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: out/*

  release:
    name: Publish release
    needs: [cli, installer, desktop-macos, desktop-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**/*
          generate_release_notes: true
          # Fresh releases have no assets to overwrite; skipping the update path
          # avoids a transient "Not Found" on the asset-update API.
          overwrite_files: false
