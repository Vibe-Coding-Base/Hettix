name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v); build-only, does not publish"
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  installer:
    name: Desktop (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -Version ${{ steps.v.outputs.version }}
      # build-installer.ps1 writes Hettix.exe and the installer into ./releases.
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: releases/*

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build and embed admin UI
        run: |
          cd admin && yarn install --frozen-lockfile && yarn run build && cd ..
          rm -rf pkg/adminui/admin && cp -R admin/dist pkg/adminui/admin
      - name: Build app bundle
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd cmd/hettix-desktop
          "$(go env GOPATH)/bin/wails" build -s -skipbindings -platform darwin/universal -ldflags "-X main.version=${VERSION}"
      - name: Bundle Chromium into the app
        run: |
          APP=cmd/hettix-desktop/build/bin/Hettix.app/Contents/MacOS
          REV=$(curl -fsSL https://storage.googleapis.com/chromium-browser-snapshots/Mac_Arm/LAST_CHANGE)
          curl -fsSL "https://storage.googleapis.com/chromium-browser-snapshots/Mac_Arm/${REV}/chrome-mac.zip" -o chrome-mac.zip
          mkdir -p "$APP/browser"
          unzip -q chrome-mac.zip -d "$APP/browser"
          chmod -R +x "$APP/browser/chrome-mac/Chromium.app/Contents/MacOS" || true
      - name: Package .dmg
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p releases dmg-root
          cp -R cmd/hettix-desktop/build/bin/Hettix.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Hettix" -srcfolder dmg-root -ov -format UDZO "releases/Hettix_${VERSION}_macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: releases/*

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - name: Install WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build and embed admin UI
        run: |
          cd admin && yarn install --frozen-lockfile && yarn run build && cd ..
          rm -rf pkg/adminui/admin && cp -R admin/dist pkg/adminui/admin
      - name: Build app binary
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd cmd/hettix-desktop
          "$(go env GOPATH)/bin/wails" build -s -skipbindings -tags webkit2_41 -ldflags "-X main.version=${VERSION}" -o Hettix
      - name: Bundle Chromium next to the binary
        run: |
          REV=$(curl -fsSL https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/LAST_CHANGE)
          curl -fsSL "https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/${REV}/chrome-linux.zip" -o chrome-linux.zip
          mkdir -p cmd/hettix-desktop/build/bin/browser
          unzip -q chrome-linux.zip -d cmd/hettix-desktop/build/bin/browser
          chmod +x cmd/hettix-desktop/build/bin/browser/chrome-linux/chrome || true
      - name: Package tarball
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p releases
          tar -C cmd/hettix-desktop/build/bin -czf "releases/Hettix_${VERSION}_linux_amd64.tar.gz" Hettix browser
      - name: Package .deb installer
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          PKG="hettix_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/hettix" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp -R cmd/hettix-desktop/build/bin/Hettix "$PKG/opt/hettix/Hettix"
          cp -R cmd/hettix-desktop/build/bin/browser "$PKG/opt/hettix/browser"
          ln -s /opt/hettix/Hettix "$PKG/usr/bin/hettix"
          printf 'Package: hettix\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nDepends: libwebkit2gtk-4.1-0, libgtk-3-0\nMaintainer: Vibe-Coding-Base <noreply@github.com>\nDescription: HTTP MITM proxy and AI-driven pentest platform\n' "$VERSION" > "$PKG/DEBIAN/control"
          printf '[Desktop Entry]\nName=Hettix\nComment=HTTP MITM proxy and AI pentest platform\nExec=/opt/hettix/Hettix\nType=Application\nCategories=Development;Security;\nTerminal=false\n' > "$PKG/usr/share/applications/hettix.desktop"
          dpkg-deb --build --root-owner-group "$PKG"
          mv "${PKG}.deb" "releases/Hettix_${VERSION}_linux_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: releases/*

  release:
    name: Publish release
    needs: [installer, desktop-macos, desktop-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**/*
          generate_release_notes: true
          # Fresh releases have no assets to overwrite; skipping the update path
          # avoids a transient "Not Found" on the asset-update API.
          overwrite_files: false
