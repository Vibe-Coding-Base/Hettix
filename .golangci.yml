version: "2"

run:
  timeout: 5m

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (net.Conn).Close
        - (*crypto/tls.Conn).Close
        - (*compress/gzip.Reader).Close
        - (io.ReadCloser).Close
        - (*go.etcd.io/bbolt.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - fmt.Fprint
  exclusions:
    paths:
      # The Wails desktop shell needs platform GUI toolkits (WebView2 / WebKit)
      # to compile, which the Linux lint runner lacks; it is built and vetted in
      # the per-platform desktop jobs instead.
      - cmd/hettix-desktop
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # ReverseProxy.Director is deprecated as of Go 1.26 in favor of Rewrite.
      # Migrating the proxy to the Rewrite API is tracked as separate work.
      - path: pkg/proxy/proxy\.go
        text: "Director has been deprecated"
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
