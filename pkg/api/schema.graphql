type HttpRequestLog {
  id: ID!
  url: String!
  method: HttpMethod!
  proto: String!
  headers: [HttpHeader!]!
  body: String
  timestamp: Time!
  response: HttpResponseLog
}

type HttpResponseLog {
  """
  Will be the same ID as its related request ID.
  """
  id: ID!
  proto: HttpProtocol!
  statusCode: Int!
  statusReason: String!
  body: String
  headers: [HttpHeader!]!
}

type HttpHeader {
  key: String!
  value: String!
}

type Project {
  id: ID!
  name: String!
  isActive: Boolean!
  settings: ProjectSettings!
}

type ProjectSettings {
  intercept: InterceptSettings!
}

type ScopeRule {
  url: Regexp
  header: ScopeHeader
  body: Regexp
  exclude: Boolean!
}

input ScopeRuleInput {
  url: Regexp
  header: ScopeHeaderInput
  body: Regexp
  exclude: Boolean
}

type ScopeHeader {
  key: Regexp
  value: Regexp
}

input ScopeHeaderInput {
  key: Regexp
  value: Regexp
}

type CloseProjectResult {
  success: Boolean!
}

type DeleteProjectResult {
  success: Boolean!
}

type ClearHTTPRequestLogResult {
  success: Boolean!
}

type DeleteSenderRequestsResult {
  success: Boolean!
}

input HttpRequestLogFilterInput {
  onlyInScope: Boolean
  searchExpression: String
}

type HttpRequestLogFilter {
  onlyInScope: Boolean!
  searchExpression: String
}

input SenderRequestInput {
  id: ID
  url: URL!
  method: HttpMethod
  proto: HttpProtocol
  headers: [HttpHeaderInput!]
  body: String
}

input HttpHeaderInput {
  key: String!
  value: String!
}

type SenderRequest {
  id: ID!
  sourceRequestLogID: ID
  url: URL!
  method: HttpMethod!
  proto: HttpProtocol!
  headers: [HttpHeader!]
  body: String
  timestamp: Time!
  response: HttpResponseLog
}

input SenderRequestFilterInput {
  onlyInScope: Boolean
  searchExpression: String
}

type SenderRequestFilter {
  onlyInScope: Boolean!
  searchExpression: String
}

type HttpRequest {
  id: ID!
  url: URL!
  method: HttpMethod!
  proto: HttpProtocol!
  headers: [HttpHeader!]!
  body: String
  response: HttpResponse
}

type HttpResponse {
  """
  Will be the same ID as its related request ID.
  """
  id: ID!
  proto: HttpProtocol!
  statusCode: Int!
  statusReason: String!
  body: String
  headers: [HttpHeader!]!
}

input ModifyRequestInput {
  id: ID!
  url: URL!
  method: HttpMethod!
  proto: HttpProtocol!
  headers: [HttpHeaderInput!]
  body: String
  modifyResponse: Boolean
}

type ModifyRequestResult {
  success: Boolean!
}

type CancelRequestResult {
  success: Boolean!
}

input ModifyResponseInput {
  requestID: ID!
  proto: HttpProtocol!
  headers: [HttpHeaderInput!]
  body: String
  statusCode: Int!
  statusReason: String!
}

type ModifyResponseResult {
  success: Boolean!
}

type CancelResponseResult {
  success: Boolean!
}

input UpdateInterceptSettingsInput {
  requestsEnabled: Boolean!
  responsesEnabled: Boolean!
  requestFilter: String
  responseFilter: String
}

type InterceptSettings {
  requestsEnabled: Boolean!
  responsesEnabled: Boolean!
  requestFilter: String
  responseFilter: String
}

enum WebSocketDirection {
  CLIENT_TO_SERVER
  SERVER_TO_CLIENT
}

type WebSocketConnection {
  id: ID!
  url: String!
  host: String!
  path: String!
  timestamp: Time!
  closedAt: Time
  messageCount: Int!
}

type WebSocketMessage {
  direction: WebSocketDirection!
  opcode: Int!
  payload: String!
  timestamp: Time!
}

type InterceptedWebSocketMessage {
  id: ID!
  connectionId: ID!
  direction: WebSocketDirection!
  opcode: Int!
  payload: String!
}

type WebSocketInterceptSettings {
  enabled: Boolean!
  filter: String
}

input UpdateWebSocketInterceptSettingsInput {
  enabled: Boolean!
  filter: String
}

input ModifyWebSocketMessageInput {
  id: ID!
  payload: String!
}

type ModifyWebSocketMessageResult {
  success: Boolean!
}

type DropWebSocketMessageResult {
  success: Boolean!
}

enum IntruderAttackStatus {
  RUNNING
  COMPLETED
}

type IntruderAttack {
  id: ID!
  name: String!
  status: IntruderAttackStatus!
  total: Int!
  completed: Int!
  timestamp: Time!
}

type IntruderResult {
  index: Int!
  payload: String!
  statusCode: Int!
  length: Int!
  durationMs: Int!
  error: String
}

input IntruderHeaderInput {
  key: String!
  value: String!
}

input StartIntruderAttackInput {
  name: String!
  method: HttpMethod!
  url: String!
  headers: [IntruderHeaderInput!]
  body: String
  payloads: [String!]!
}

type SitemapEntry {
  host: String!
  path: String!
  methods: [String!]!
  statusCodes: [Int!]!
  count: Int!
}

enum FindingSeverity {
  INFO
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

type Finding {
  id: ID!
  title: String!
  description: String!
  severity: FindingSeverity!
  requestLogID: ID
  timestamp: Time!
}

input CreateFindingInput {
  title: String!
  description: String
  severity: FindingSeverity!
  requestLogID: ID
}

type DeleteFindingResult {
  success: Boolean!
}

enum WorkflowStepType {
  SEARCH
  FUZZ
  FINDING
}

type WorkflowStep {
  type: WorkflowStepType!
  query: String
  name: String
  method: String
  url: String
  body: String
  payloads: [String!]
  title: String
  description: String
  severity: String
}

input WorkflowStepInput {
  type: WorkflowStepType!
  query: String
  name: String
  method: String
  url: String
  body: String
  payloads: [String!]
  title: String
  description: String
  severity: String
}

type Workflow {
  id: ID!
  name: String!
  steps: [WorkflowStep!]!
  timestamp: Time!
}

input SaveWorkflowInput {
  id: ID
  name: String!
  steps: [WorkflowStepInput!]!
}

type WorkflowStepResult {
  type: WorkflowStepType!
  output: String!
  error: String
}

type DeleteWorkflowResult {
  success: Boolean!
}

type Query {
  httpRequestLog(id: ID!): HttpRequestLog
  httpRequestLogs(offset: Int, limit: Int): [HttpRequestLog!]!
  httpRequestLogFilter: HttpRequestLogFilter
  activeProject: Project
  projects: [Project!]!
  scope: [ScopeRule!]!
  senderRequest(id: ID!): SenderRequest
  senderRequests(offset: Int, limit: Int): [SenderRequest!]!
  interceptedRequests: [HttpRequest!]!
  interceptedRequest(id: ID!): HttpRequest
  matchReplaceRules: [MatchReplaceRule!]!
  webSocketConnections(searchExpression: String): [WebSocketConnection!]!
  webSocketConnection(id: ID!): WebSocketConnection
  webSocketMessages(connectionId: ID!, searchExpression: String): [WebSocketMessage!]!
  interceptedWebSocketMessages: [InterceptedWebSocketMessage!]!
  webSocketInterceptSettings: WebSocketInterceptSettings!
  intruderAttacks: [IntruderAttack!]!
  intruderAttack(id: ID!): IntruderAttack
  intruderResults(attackId: ID!): [IntruderResult!]!
  sitemap: [SitemapEntry!]!
  findings: [Finding!]!
  workflows: [Workflow!]!
  workflow(id: ID!): Workflow
}

enum MatchReplacePhase {
  REQUEST
  RESPONSE
}

type MatchReplaceRule {
  id: ID!
  name: String!
  enabled: Boolean!
  phase: MatchReplacePhase!
  condition: String
  headerName: String
  headerValue: String
  removeHeader: Boolean!
  bodyMatcher: String
  bodyReplacement: String
}

input MatchReplaceRuleInput {
  name: String!
  enabled: Boolean!
  phase: MatchReplacePhase!
  condition: String
  headerName: String
  headerValue: String
  removeHeader: Boolean
  bodyMatcher: String
  bodyReplacement: String
}

type Mutation {
  createProject(name: String!): Project
  openProject(id: ID!): Project
  closeProject: CloseProjectResult!
  deleteProject(id: ID!): DeleteProjectResult!
  clearHTTPRequestLog: ClearHTTPRequestLogResult!
  setScope(scope: [ScopeRuleInput!]!): [ScopeRule!]!
  setHttpRequestLogFilter(
    filter: HttpRequestLogFilterInput
  ): HttpRequestLogFilter
  setSenderRequestFilter(filter: SenderRequestFilterInput): SenderRequestFilter
  createOrUpdateSenderRequest(request: SenderRequestInput!): SenderRequest!
  createSenderRequestFromHttpRequestLog(id: ID!): SenderRequest!
  sendRequest(id: ID!): SenderRequest!
  deleteSenderRequests: DeleteSenderRequestsResult!
  modifyRequest(request: ModifyRequestInput!): ModifyRequestResult!
  cancelRequest(id: ID!): CancelRequestResult!
  modifyResponse(response: ModifyResponseInput!): ModifyResponseResult!
  cancelResponse(requestID: ID!): CancelResponseResult!
  updateInterceptSettings(
    input: UpdateInterceptSettingsInput!
  ): InterceptSettings!
  runAgent(input: RunAgentInput!): AgentReply!
  setMatchReplaceRules(rules: [MatchReplaceRuleInput!]!): [MatchReplaceRule!]!
  updateWebSocketInterceptSettings(
    input: UpdateWebSocketInterceptSettingsInput!
  ): WebSocketInterceptSettings!
  modifyWebSocketMessage(input: ModifyWebSocketMessageInput!): ModifyWebSocketMessageResult!
  forwardWebSocketMessage(id: ID!): ModifyWebSocketMessageResult!
  dropWebSocketMessage(id: ID!): DropWebSocketMessageResult!
  startIntruderAttack(input: StartIntruderAttackInput!): IntruderAttack!
  createFinding(input: CreateFindingInput!): Finding!
  deleteFinding(id: ID!): DeleteFindingResult!
  saveWorkflow(input: SaveWorkflowInput!): Workflow!
  deleteWorkflow(id: ID!): DeleteWorkflowResult!
  runWorkflow(id: ID!): [WorkflowStepResult!]!
}

enum AgentMode {
  ASK
  ASSIST
  AUTO
}

input RunAgentInput {
  message: String!
  mode: AgentMode
}

type AgentAction {
  tool: String!
  input: String!
  output: String!
  denied: Boolean!
}

type AgentReply {
  reply: String!
  actions: [AgentAction!]!
}

enum HttpMethod {
  GET
  HEAD
  POST
  PUT
  DELETE
  CONNECT
  OPTIONS
  TRACE
  PATCH
}

enum HttpProtocol {
  HTTP10
  HTTP11
  HTTP20
}

scalar Time
scalar Regexp
scalar URL
